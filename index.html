<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumpleaños · Grupo Bondad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            max-width: 900px;
            margin: 0 auto 1.5rem;
            padding: 1rem 1.5rem;
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .header .back-link:hover {
            color: #00ff99;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #00ff99, #4A6CF7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header h1 i {
            -webkit-text-fill-color: initial;
            color: #00ff99;
        }

        .header .date-display {
            font-size: 0.8rem;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem 1rem;
            border-radius: 30px;
        }

        /* ===== CONTENEDOR ===== */
        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* ===== BOX ===== */
        .box {
            margin-top: 20px;
            padding: 24px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .box-titulo {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .box-titulo i {
            color: #00ff99;
        }

        /* ===== SELECTOR DE MES ===== */
        .mes-selector {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .mes-selector select {
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 0.5rem 2rem 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%2300ff99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
            background-repeat: no-repeat;
            background-position: right 0.7rem center;
            background-size: 1rem;
        }

        .mes-selector select:hover {
            border-color: #00ff99;
        }

        .mes-navegacion {
            display: flex;
            gap: 0.3rem;
        }

        .btn-mes {
            background: #0f172a;
            border: 1px solid #334155;
            color: #94a3b8;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-mes:hover {
            background: #1e293b;
            border-color: #00ff99;
            color: #00ff99;
        }

        .btn-hoy {
            background: rgba(0, 255, 153, 0.08);
            border-color: #00ff99;
            color: #00ff99;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0 12px;
            width: auto;
            gap: 0.2rem;
        }

        /* ===== CUMPLEAÑOS ===== */
        .cumple-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .cumple-card {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 16px 20px;
            border-left: 3px solid #fbbf24;
            transition: all 0.3s ease;
        }

        .cumple-card:hover {
            border-color: #fbbf24;
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(251, 191, 36, 0.08);
        }

        .cumple-nombre {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 1.05rem;
        }

        .cumple-fecha {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .cumple-edad {
            font-size: 0.8rem;
            color: #00ff99;
            margin-top: 4px;
            font-weight: 600;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
            font-size: 0.95rem;
        }

        .empty i {
            font-size: 2.5rem;
            color: #334155;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== PRELOADER ===== */
        #preloader {
            position: fixed;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        #preloader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #1e293b;
            border-top: 4px solid #00ff99;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #preloader p {
            color: #94a3b8;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        #preloader p i {
            color: #00ff99;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .header {
                padding: 0.8rem 1rem;
            }

            .header h1 {
                font-size: 1.2rem;
            }

            .box {
                padding: 16px;
            }

            .cumple-grid {
                grid-template-columns: 1fr;
            }

            .mes-selector {
                justify-content: flex-start;
            }
        }

        @media (max-width: 400px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .header .back-link {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <a href="/index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
        <h1>
            <i class="fas fa-birthday-cake"></i> Cumpleaños
        </h1>
        <span class="date-display" id="dateDisplay">
            <i class="far fa-calendar-alt"></i>
            <span id="currentDate">--</span>
        </span>
    </header>

    <!-- ===== PRELOADER ===== -->
    <div id="preloader">
        <div class="loader"></div>
        <p><i class="fas fa-spinner fa-spin"></i> Cargando cumpleaños...</p>
    </div>

    <!-- ===== CONTENEDOR ===== -->
    <div class="container">

        <!-- ===== CUMPLEAÑOS ===== -->
        <div class="box">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 18px;">
                <div class="box-titulo" id="boxTitulo" style="margin-bottom: 0;">
                    <i class="fas fa-birthday-cake"></i>
                    <span id="tituloCumple">🎂 Cumpleaños del mes</span>
                </div>

                <!-- SELECTOR DE MES -->
                <div class="mes-selector">
                    <div class="mes-navegacion">
                        <button class="btn-mes" id="btnAnterior" title="Mes anterior"><i class="fas fa-chevron-left"></i></button>
                        <button class="btn-mes btn-hoy" id="btnHoy"><i class="fas fa-calendar-check"></i> Hoy</button>
                        <button class="btn-mes" id="btnSiguiente" title="Mes siguiente"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <select id="selectMes" aria-label="Seleccionar mes">
                        <option value="0">Enero</option>
                        <option value="1">Febrero</option>
                        <option value="2">Marzo</option>
                        <option value="3">Abril</option>
                        <option value="4">Mayo</option>
                        <option value="5">Junio</option>
                        <option value="6">Julio</option>
                        <option value="7">Agosto</option>
                        <option value="8">Septiembre</option>
                        <option value="9">Octubre</option>
                        <option value="10">Noviembre</option>
                        <option value="11">Diciembre</option>
                    </select>
                </div>
            </div>

            <div id="listaCumpleanos" class="cumple-grid">
                <div class="empty">
                    <i class="fas fa-spinner fa-spin"></i>
                    Cargando cumpleaños...
                </div>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ============================================
            // CONFIGURACIÓN
            // ============================================
            const SHEET_PUBLISH_ID = '2PACX-1vRkESnacV9IzF72ZzkRFs6DxkO3vHngHQhzhz6UfttuOzbyz4ZvmVkjdiykh_9Wc7bwR3NZl2f6etit';

            const CUMPLE_URL =
                `https://docs.google.com/spreadsheets/d/e/${SHEET_PUBLISH_ID}/pub?gid=1172969153&single=true&output=csv`;

            const meses = [
                "Enero", "Febrero", "Marzo", "Abril",
                "Mayo", "Junio", "Julio", "Agosto",
                "Septiembre", "Octubre", "Noviembre", "Diciembre"
            ];

            let cumpleanosData = []; // Guardar todos los cumpleaños
            
            // Variables para el mes seleccionado
            let mesSeleccionado = new Date().getMonth(); // 0-11

            // ============================================
            // FECHA LIMA
            // ============================================
            function formatearFechaLegible() {
                const now = new Date();
                const options = { timeZone: 'America/Lima', day: '2-digit', month: 'long', year: 'numeric' };
                return now.toLocaleDateString('es-ES', options);
            }

            function getFechaLima() {
                const now = new Date();
                const options = { timeZone: 'America/Lima', year: 'numeric', month: 'numeric', day: 'numeric' };
                const partes = now.toLocaleDateString('es-PE', options).split('/');
                return {
                    dia: parseInt(partes[0]),
                    mes: parseInt(partes[1]),
                    año: parseInt(partes[2])
                };
            }

            // ============================================
            // CALCULAR EDAD (basado en el año actual)
            // ============================================
            function calcularEdad(fechaNacimiento) {
                const hoy = getFechaLima();
                const partes = fechaNacimiento.split('-');
                const diaNac = parseInt(partes[0]);
                const mesNac = parseInt(partes[1]);
                const añoNac = parseInt(partes[2]);

                let edad = hoy.año - añoNac;
                if (hoy.mes < mesNac || (hoy.mes === mesNac && hoy.dia < diaNac)) {
                    edad--;
                }
                return edad;
            }

            // ============================================
            // RENDERIZAR CUMPLEAÑOS (según mes seleccionado)
            // ============================================
            function renderizarCumpleanos() {
                const lista = document.getElementById('listaCumpleanos');
                const mesActual = mesSeleccionado; // 0-11
                const mesNombre = meses[mesActual];

                // Actualizar título
                document.getElementById('tituloCumple').innerText = `🎂 Cumpleaños de ${mesNombre}`;

                // Filtrar por mes seleccionado
                const filtrados = cumpleanosData.filter(item => item.mes === mesActual);

                // Ordenar por día
                filtrados.sort((a, b) => a.dia - b.dia);

                if (filtrados.length === 0) {
                    lista.innerHTML = `
                        <div class="empty">
                            <i class="fas fa-smile"></i>
                            No hay cumpleaños en ${mesNombre}
                        </div>
                    `;
                    return;
                }

                let html = '';
                filtrados.forEach(item => {
                    const edad = calcularEdad(item.fechaCompleta);
                    const fechaBonita = `${item.dia} de ${meses[item.mes]}`;

                    html += `
                        <div class="cumple-card">
                            <div class="cumple-nombre">🎉 ${item.nombre}</div>
                            <div class="cumple-fecha">📅 ${fechaBonita}</div>
                            <div class="cumple-edad">🎂 ${edad} años</div>
                        </div>
                    `;
                });

                lista.innerHTML = html;
            }

            // ============================================
            // ACTUALIZAR INTERFAZ DEL SELECTOR
            // ============================================
            function actualizarInterfazMes() {
                const select = document.getElementById('selectMes');
                if (select) select.value = mesSeleccionado;
                renderizarCumpleanos();
            }

            function irMesAnterior() {
                if (mesSeleccionado === 0) {
                    mesSeleccionado = 11;
                } else {
                    mesSeleccionado--;
                }
                actualizarInterfazMes();
            }

            function irMesSiguiente() {
                if (mesSeleccionado === 11) {
                    mesSeleccionado = 0;
                } else {
                    mesSeleccionado++;
                }
                actualizarInterfazMes();
            }

            function irHoy() {
                const lima = getFechaLima();
                mesSeleccionado = lima.mes - 1; // convertir 1-12 a 0-11
                actualizarInterfazMes();
            }

            // ============================================
            // CARGAR CUMPLEAÑOS (Columna A = Nombre, Columna G = Fecha)
            // ============================================
            async function cargarCumpleanos() {
                const lista = document.getElementById('listaCumpleanos');

                try {
                    const res = await fetch(CUMPLE_URL);
                    const data = await res.text();
                    const rows = data.trim().split('\n');

                    cumpleanosData = []; // Reiniciar

                    rows.slice(1).forEach(row => {
                        const cols = row.split(',');
                        const nombre = cols[0]?.trim();        // Columna A
                        const fechaCompleta = cols[7]?.trim(); // Columna G (15-05-2005)

                        if (!nombre || !fechaCompleta) return;

                        // Formato: 15-05-2005
                        const partes = fechaCompleta.split('-');
                        if (partes.length !== 3) return;

                        const dia = parseInt(partes[0]);
                        const mes = parseInt(partes[1]) - 1; // convertir a 0-11
                        const anio = parseInt(partes[2]);

                        cumpleanosData.push({
                            nombre: nombre,
                            fechaCompleta: fechaCompleta,
                            dia: dia,
                            mes: mes,
                            anio: anio
                        });
                    });

                    // Inicializar con mes actual de Lima
                    const lima = getFechaLima();
                    mesSeleccionado = lima.mes - 1;
                    
                    actualizarInterfazMes();

                } catch (err) {
                    console.error(err);
                    lista.innerHTML = `
                        <div class="empty">
                            <i class="fas fa-exclamation-triangle"></i>
                            Error al cargar cumpleaños
                        </div>
                    `;
                }
            }

            // ============================================
            // OCULTAR PRELOADER
            // ============================================
            function ocultarPreloader() {
                const preloader = document.getElementById('preloader');
                setTimeout(() => {
                    preloader.classList.add('hidden');
                    setTimeout(() => {
                        preloader.style.display = 'none';
                    }, 400);
                }, 300);
            }

            // ============================================
            // CONFIGURAR EVENTOS
            // ============================================
            function configurarEventos() {
                document.getElementById('btnAnterior')?.addEventListener('click', irMesAnterior);
                document.getElementById('btnSiguiente')?.addEventListener('click', irMesSiguiente);
                document.getElementById('btnHoy')?.addEventListener('click', irHoy);

                const select = document.getElementById('selectMes');
                if (select) {
                    select.addEventListener('change', function(e) {
                        mesSeleccionado = parseInt(e.target.value);
                        actualizarInterfazMes();
                    });
                }
            }

            // ============================================
            // INIT
            // ============================================
            window.onload = async function() {
                // Mostrar fecha
                document.getElementById('currentDate').textContent = formatearFechaLegible();

                // Configurar eventos del selector
                configurarEventos();

                // Cargar cumpleaños
                await cargarCumpleanos();

                // Ocultar preloader
                ocultarPreloader();

                console.log('✅ Cumpleaños cargados correctamente');
            };

        })();
    </script>

</body>
</html>
